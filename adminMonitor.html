<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Absensi • IT Club</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap');

        :root {
            /* Brand Colors from Logo */
            --brand-orange: #f68b1f;      /* Vibrant Orange */
            --brand-dark: #2d2438;        /* Deep Purple-Black */
            --brand-light: #ffffff;
            --brand-bg: #f5f4f2;          /* Warm soft gray-white */
            --brand-gray: #7a7285;        /* Neutral Slate Gray */
            --brand-accent: #fdf6ee;      /* Very soft warm tint */
            
            --border-width: 3px;
            --neo-shadow: 8px 8px 0px var(--brand-dark);
            --neo-shadow-btn: 4px 4px 0px var(--brand-dark);
            
            --transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lexend', system-ui, -apple-system, sans-serif;
            background-color: var(--brand-bg);
            /* Double-circle watermark pattern in the background */
            background-image: 
                radial-gradient(circle, transparent 20%, var(--brand-bg) 20%, var(--brand-bg) 80%, transparent 80%, transparent),
                radial-gradient(circle, transparent 20%, var(--brand-bg) 20%, var(--brand-bg) 80%, transparent 80%, transparent);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            min-height: 100vh;
            padding: 40px 16px;
            color: var(--brand-dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: var(--brand-light);
            border: 2.5px solid var(--brand-dark);
            padding: 12px 20px;
            border-radius: 9999px; /* Pill Shape */
            cursor: pointer;
            font-weight: 800;
            color: var(--brand-dark);
            box-shadow: var(--neo-shadow-btn);
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            font-size: 13px;
        }

        .back-btn:hover {
            background: var(--brand-accent);
            transform: translate(-1.5px, -1.5px);
            box-shadow: 5.5px 5.5px 0px var(--brand-dark);
        }

        .back-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--brand-dark);
        }

        .header-icon {
            font-size: 28px;
            color: var(--brand-orange);
            background: var(--brand-light);
            border: 2.5px solid var(--brand-dark);
            outline: 1.5px solid var(--brand-dark);
            outline-offset: 3px;
            padding: 12px;
            border-radius: 50%;
            box-shadow: 3px 3px 0px var(--brand-dark);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .header h1 span {
            background: var(--brand-orange);
            color: var(--brand-light);
            padding: 2px 10px;
            border: 2.5px solid var(--brand-dark);
            border-radius: 9999px;
            box-shadow: 2px 2px 0px var(--brand-dark);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-picker {
            padding: 12px 18px;
            border: 2.5px solid var(--brand-dark);
            border-radius: 9999px; /* Pill Shape */
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            background: var(--brand-light);
            color: var(--brand-dark);
            cursor: pointer;
            transition: var(--transition);
        }

        .date-picker:focus {
            outline: none;
            box-shadow: 3px 3px 0px var(--brand-orange);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 9999px; /* Pill Shape */
            border: var(--border-width) solid var(--brand-dark);
            font-weight: 900;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--brand-orange);
            color: var(--brand-light);
            box-shadow: var(--neo-shadow-btn);
        }

        .btn-primary:hover {
            background: #f97316;
            transform: translate(-1.5px, -1.5px);
            box-shadow: 5.5px 5.5px 0px var(--brand-dark);
        }

        .btn-primary:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--brand-dark);
        }

        .btn-outline {
            background: var(--brand-light);
            color: var(--brand-dark);
            box-shadow: var(--neo-shadow-btn);
        }

        .btn-outline:hover {
            background: var(--brand-accent);
            transform: translate(-1.5px, -1.5px);
            box-shadow: 5.5px 5.5px 0px var(--brand-dark);
        }

        .btn-outline:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--brand-dark);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--brand-light);
            border-radius: 9999px; /* Pill Shape */
            border: 2.5px solid var(--brand-dark);
            box-shadow: var(--neo-shadow-btn);
        }

        .auto-refresh label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--brand-dark);
        }

        .auto-refresh select {
            border: 2px solid var(--brand-dark);
            border-radius: 8px;
            padding: 4px 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            background: white;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--brand-light);
            padding: 20px;
            border-radius: 24px;
            border: var(--border-width) solid var(--brand-dark);
            box-shadow: var(--neo-shadow-btn);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%; /* Circle logo motif */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 2px solid var(--brand-dark);
            box-shadow: 2px 2px 0px var(--brand-dark);
        }

        .stat-icon.total {
            background: var(--brand-accent);
            color: var(--brand-dark);
        }

        .stat-icon.hadir {
            background: #d1fae5;
            color: #065f46;
        }

        .stat-icon.belum {
            background: #fef3c7;
            color: #92400e;
        }

        .stat-info h3 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .stat-info p {
            color: var(--brand-gray);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Table Container */
        .table-container {
            background: var(--brand-light);
            border-radius: 24px;
            border: var(--border-width) solid var(--brand-dark);
            /* Double outline effect */
            outline: 2px solid var(--brand-dark);
            outline-offset: 4px;
            box-shadow: var(--neo-shadow);
            overflow: hidden;
            margin: 6px;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: var(--border-width) solid var(--brand-dark);
            background: var(--brand-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .table-header h2 {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 10px 16px 10px 40px;
            border: 2.5px solid var(--brand-dark);
            border-radius: 9999px; /* Pill Shape */
            font-size: 13px;
            font-weight: 700;
            width: 250px;
            font-family: inherit;
            background: var(--brand-light);
            color: var(--brand-dark);
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 3px 3px 0px var(--brand-orange);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #faf9f6;
            border-bottom: 2.5px solid var(--brand-dark);
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 800;
            color: var(--brand-dark);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1.5px solid var(--brand-dark);
            font-weight: 700;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 9999px; /* Pill Shape */
            font-size: 10px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 2px solid var(--brand-dark);
            box-shadow: 2px 2px 0px var(--brand-dark);
            text-transform: uppercase;
        }

        .status-hadir {
            background: #d1fae5;
            color: #065f46;
        }

        .status-belum {
            background: #fef3c7;
            color: #92400e;
        }

        .ttd-preview {
            width: 50px;
            height: 30px;
            border: 2px solid var(--brand-dark);
            border-radius: 6px;
            object-fit: contain;
            background: white;
            box-shadow: 1.5px 1.5px 0px var(--brand-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--brand-gray);
            font-weight: 700;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            opacity: 0.8;
            color: var(--brand-dark);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--brand-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .last-update {
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
            margin-top: 10px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls {
                width: 100%;
            }

            .search-box input {
                width: 100%;
            }

            table {
                font-size: 0.9rem;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Kembali
                </a>
                <i class="fas fa-chart-line header-icon"></i>
                <h1>Monitor <span>Absensi</span></h1>
            </div>

            <div class="controls">
                <input type="date" id="datePicker" class="date-picker">
                <button onclick="refreshData()" class="btn btn-primary">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button onclick="exportCurrentView()" class="btn btn-outline">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>
        </div>

        <!-- Auto Refresh Control -->
        <div style="margin-bottom: 20px;">
            <div class="auto-refresh">
                <i class="fas fa-clock"></i>
                <label>Auto-refresh:</label>
                <select id="refreshInterval" onchange="setAutoRefresh()">
                    <option value="0">Manual</option>
                    <option value="30">30 detik</option>
                    <option value="60">1 menit</option>
                    <option value="300" selected>5 menit</option>
                </select>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalSiswa">0</h3>
                    <p>Total Siswa</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon hadir">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalHadir">0</h3>
                    <p>Sudah Absen</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon belum">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalBelum">0</h3>
                    <p>Belum Absen</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e0e7ff; color: #4f46e5;">
                    <i class="fas fa-percentage"></i>
                </div>
                <div class="stat-info">
                    <h3 id="persentase">0%</h3>
                    <p>Kehadiran</p>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>
                    <i class="fas fa-list-ul"></i>
                    Daftar Absensi
                </h2>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama atau kelas..." oninput="filterTable()">
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Siswa</th>
                            <th>Kelas</th>
                            <th>Status</th>
                            <th>Waktu Absen</th>
                            <th>Tanda Tangan</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <p style="margin-top: 15px; color: var(--gray);">Memuat data...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="last-update" id="lastUpdate">
                Terakhir diperbarui: -
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            where,
            getDocs,
            orderBy,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA47cTihvHBnqYcn4HDlOKJf88O7MmzINo",
            authDomain: "absenit-92dd9.firebaseapp.com",
            projectId: "absenit-92dd9",
            storageBucket: "absenit-92dd9.firebasestorage.app",
            messagingSenderId: "219381976986",
            appId: "1:219381976986:web:7f1ac4bd70470a52e63423"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allData = [];
        let autoRefreshInterval;
        let daftarSiswa = [];

        // Set tanggal hari ini sebagai default
        document.getElementById('datePicker').valueAsDate = new Date();

        // Load daftar siswa dari template
        async function loadDaftarSiswa() {
            try {
                const response = await fetch('assets/TemplateAbsensi.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(arrayBuffer);
                const worksheet = workbook.getWorksheet(1);

                daftarSiswa = [];
                worksheet.eachRow((row, rowNumber) => {
                    if (rowNumber >= 5) {
                        const nama = row.getCell(2).text.trim();
                        const kelas = row.getCell(3).text.trim();
                        if (nama && kelas) {
                            daftarSiswa.push({ nama, kelas });
                        }
                    }
                });
            } catch (error) {
                console.error('Gagal load daftar siswa:', error);
            }
        }

        // Fungsi utama untuk refresh data
        async function refreshData() {
            const tanggalInput = document.getElementById('datePicker').value;
            if (!tanggalInput) return;

            const start = new Date(tanggalInput);
            start.setHours(0, 0, 0, 0);
            const end = new Date(tanggalInput);
            end.setHours(23, 59, 59, 999);

            // Pastikan daftar siswa sudah diload
            if (daftarSiswa.length === 0) {
                await loadDaftarSiswa();
            }

            // Ambil data presensi dari Firebase
            const q = query(
                collection(db, "presensi"),
                where("timestamp", ">=", start),
                where("timestamp", "<=", end),
                orderBy("timestamp", "asc")
            );

            try {
                const querySnapshot = await getDocs(q);
                const presensiMap = {};

                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    presensiMap[`${d.nama}-${d.kelas}`] = {
                        timestamp: d.timestamp?.toDate() || new Date(),
                        ttd: d.ttd || null
                    };
                });

                // Gabungkan dengan daftar siswa
                allData = daftarSiswa.map((siswa, index) => {
                    const key = `${siswa.nama}-${siswa.kelas}`;
                    const presensi = presensiMap[key];

                    return {
                        no: index + 1,
                        nama: siswa.nama,
                        kelas: siswa.kelas,
                        hadir: !!presensi,
                        waktu: presensi ? presensi.timestamp : null,
                        ttd: presensi ? presensi.ttd : null
                    };
                });

                updateTable(allData);
                updateStats();
                updateLastRefresh();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-exclamation-triangle"></i>
                                <p>Gagal memuat data. Silakan coba lagi.</p>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }

        function updateTable(data) {
            const tbody = document.getElementById('tableBody');

            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>Tidak ada data untuk ditampilkan</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr style="${item.hadir ? '' : 'background: #fffbeb;'}">
                    <td>${item.no}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td>${item.kelas}</td>
                    <td>
                        <span class="status-badge ${item.hadir ? 'status-hadir' : 'status-belum'}">
                            <i class="fas ${item.hadir ? 'fa-check-circle' : 'fa-clock'}"></i>
                            ${item.hadir ? 'Hadir' : 'Belum Absen'}
                        </span>
                    </td>
                    <td>${item.waktu ? formatTime(item.waktu) : '-'}</td>
                    <td>
                        ${item.ttd ?
                    `<img src="${item.ttd}" class="ttd-preview" alt="TTD" title="Tanda tangan ${item.nama}">` :
                    '<span style="color: #94a3b8;">-</span>'
                }
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const total = allData.length;
            const hadir = allData.filter(d => d.hadir).length;
            const belum = total - hadir;
            const persentase = total > 0 ? Math.round((hadir / total) * 100) : 0;

            document.getElementById('totalSiswa').textContent = total;
            document.getElementById('totalHadir').textContent = hadir;
            document.getElementById('totalBelum').textContent = belum;
            document.getElementById('persentase').textContent = persentase + '%';
        }

        function updateLastRefresh() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                `Terakhir diperbarui: ${formatTime(now)}`;
        }

        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item =>
                item.nama.toLowerCase().includes(searchTerm) ||
                item.kelas.toLowerCase().includes(searchTerm)
            );
            updateTable(filtered);
        }

        function formatTime(date) {
            return date.toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function setAutoRefresh() {
            const interval = parseInt(document.getElementById('refreshInterval').value);

            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }

            if (interval > 0) {
                autoRefreshInterval = setInterval(refreshData, interval * 1000);
            }
        }

        async function exportCurrentView() {
            if (allData.length === 0) {
                alert('Tidak ada data untuk diexport!');
                return;
            }

            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Monitoring Absensi');

            // Header
            worksheet.columns = [
                { header: 'No', key: 'no', width: 8 },
                { header: 'Nama Siswa', key: 'nama', width: 30 },
                { header: 'Kelas', key: 'kelas', width: 15 },
                { header: 'Status', key: 'status', width: 15 },
                { header: 'Waktu Absen', key: 'waktu', width: 20 }
            ];

            // Styling header
            worksheet.getRow(1).font = { bold: true };
            worksheet.getRow(1).fill = {
                type: 'pattern',
                pattern: 'solid',
                fgColor: { argb: 'FF4361EE' }
            };
            worksheet.getRow(1).font = { color: { argb: 'FFFFFFFF' }, bold: true };

            // Data
            allData.forEach(item => {
                worksheet.addRow({
                    no: item.no,
                    nama: item.nama,
                    kelas: item.kelas,
                    status: item.hadir ? 'Hadir' : 'Belum Absen',
                    waktu: item.waktu ? formatTime(item.waktu) : '-'
                });
            });

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Monitoring_Absen_${document.getElementById('datePicker').value}.xlsx`;
            a.click();
        }

        // Inisialisasi
        loadDaftarSiswa().then(() => {
            refreshData();
            setAutoRefresh(); // Aktifkan auto-refresh default 5 menit
        });

        // Expose functions to global scope
        window.refreshData = refreshData;
        window.filterTable = filterTable;
        window.setAutoRefresh = setAutoRefresh;
        window.exportCurrentView = exportCurrentView;
    </script>
</body>

</html>
